name: Export draw.io diagrams

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export draw.io to PNG
        uses: rlespinasse/drawio-export-action@v2
        with:
          format: png
          path: assets
          output: .
          remove-page-suffix: true
          scale: 4
          action-mode: all

      - name: Commit PNG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: export draw.io to PNG"
          file_pattern: "assets/**/*.png"
