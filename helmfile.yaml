environments:
  local:
    values:
      - environments/local.yaml
  dev:
    values:
      - environments/dev.yaml
  prod:
    values:
      - environments/prod.yaml

---

repositories:
  - name: jetstack
    url: https://charts.jetstack.io

releases:

  ## Cert-manager ##

  - name: certs-manager
    chart: ./charts/certs-manager
    namespace: networking
    createNamespace: true

  ## Gateway API ##

  # Install the Gateway API CRDs and Envoy Gateway Controller
  - name: envoy-controller
    chart: ./charts/gateway-controller
    namespace: networking
    createNamespace: true

  # Install the Envoy Gateway Class and bind to the Envoy controller
  - name: gateway-class
    chart: ./charts/gateway-class
    namespace: networking
    createNamespace: true
    needs:
      - networking/envoy-controller

  # Install the Envoy Gateway
  - name: gateway
    chart: ./charts/gateway
    namespace: networking
    createNamespace: true
    needs:
      - networking/certs-manager
      - networking/gateway-class

    values:
      - environments/{{ .Environment.Name }}.yaml
