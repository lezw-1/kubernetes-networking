repositories:
  - name: jetstack
    url: https://charts.jetstack.io

environments:
  local:
    values:
      - environments/local.yaml
  dev:
    values:
      - environments/dev.yaml
  prod:
    values:
      - environments/prod.yaml

---

releases:

  # cert-manager: Provisions and renews TLS certificates via Let's Encrypt
  - name: certs
    chart: jetstack/cert-manager
    version: "v1.16.2"
    namespace: networking
    createNamespace: true
    values:
      - charts/certs/values.yaml

  # Envoy Gateway controller: Orchestrates all gateway APIs
  - name: gateway-controller
    chart: ./charts/gateway-controller
    namespace: networking
    createNamespace: true
    hooks:
      - events: ["presync"]
        command: "kubectl"
        args:
          - "apply"
          - "--server-side"
          - "--force-conflicts"
          - "-f"
          - "charts/gateway-controller/crds/"

  # Envoy Gateway resources: Defines GatewayClass, Gateway, and TLS certificates
  - name: gateway
    chart: ./charts/gateway
    namespace: networking
    createNamespace: true
    needs:
      - networking/gateway-controller
      - networking/certs
    hooks:
      - events: ["presync"]
        command: "kubectl"
        args:
          - "wait"
          - "--for=condition=Established"
          - "crd/backends.gateway.envoyproxy.io"
          - "crd/backendtrafficpolicies.gateway.envoyproxy.io"
          - "crd/clienttrafficpolicies.gateway.envoyproxy.io"
          - "crd/envoyextensionpolicies.gateway.envoyproxy.io"
          - "crd/envoypatchpolicies.gateway.envoyproxy.io"
          - "crd/envoyproxies.gateway.envoyproxy.io"
          - "crd/httproutefilters.gateway.envoyproxy.io"
          - "crd/securitypolicies.gateway.envoyproxy.io"
          - "--timeout=120s"
    values:
      - environments/{{ .Environment.Name }}.yaml
